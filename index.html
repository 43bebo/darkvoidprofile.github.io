<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DarkVoid</title>
  <link rel="icon" type="image/png" href="rem.png">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #141414 0%, #000000 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-gradient);
      background-color: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .character-container {
      position: relative;
      width: 450px; 
      height: 450px;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 0 30px rgba(0, 0, 0, 0.9));
    }

    .anime-gif {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 1rem;
      opacity: 0.85;
      transition: opacity 1s ease;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-35px); }
    }

    @keyframes shadow-scale {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.6); opacity: 1; }
    }
  </style>
</head>
<body>

  <main>
    <div class="character-container">
      <img src="dance.gif" alt="" class="anime-gif">
    </div>
    <div class="shadow"></div>
  </main>

</body>
</html>
