<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DarkVoid</title>
  <link rel="icon" type="image/png" href="rem.png">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #000000 0%, #000000 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-gradient);
      background-color: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .character-container {
      position: relative;
      width: 250px; 
      height: 250px;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 0 30px rgba(0, 0, 0, 0.9));
    }

    .anime-gif {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 1rem;
      opacity: 0.85;
      transition: opacity 1s ease;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-35px); }
    }

    @keyframes shadow-scale {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.6); opacity: 1; }
    }
  </style>
</head>
<body>

  <main>
    <div class="character-container">
      <img src="dance.gif" alt="" class="anime-gif">
    </div>
    <div class="shadow"></div>
  </main>

<div id="toast-container"></div>

<style>
    #toast-container {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column-reverse;
        gap: 12px;
        z-index: 9999;
        pointer-events: none;
    }
    .toast-message {
        background: rgba(24, 24, 27, 0.85); 
        backdrop-filter: blur(12px); 
        -webkit-backdrop-filter: blur(12px);
        color: #ffffff;
        padding: 12px 24px;
        border-radius: 99px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        font-weight: 500;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.1);
        text-align: center;
        white-space: nowrap;
        
        animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, 
                   fadeOut 0.3s ease-in 1.2s forwards;
    }
    @keyframes popIn {
        0% { opacity: 0; transform: translateY(20px) scale(0.9); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes fadeOut {
        0% { opacity: 1; }
        100% { opacity: 0; }
    }
</style>
<script>
    document.addEventListener('contextmenu', function(event) {
        event.preventDefault();
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast-message';
        toast.innerHTML = '🛡️ Action not allowed'; 
        container.appendChild(toast);

        setTimeout(() => {
            toast.remove();
        }, 1000);
    });
</script>
</body>
</html>
